name: CI

on:
  push:
    branches: [main, neomind-v2-rebuild]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Test host protocol
        run: python -m unittest discover -s tests -v
